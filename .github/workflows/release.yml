name: release pipeline

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    # A reusable workflow can only use permissions the caller grants, and the
    # permission check runs before any job condition is evaluated - so every job
    # build-test-publish nests must be satisfiable here even when it will never
    # run. npm-audit-autofix needs pull-requests: write although this is not an
    # npm project. Granting less fails the run at startup in about a second, with
    # the reason visible only in the web UI.
    permissions:
      actions: write         # test-and-build, release-github
      attestations: write    # test-and-build
      contents: write        # release-github, set-git-tag
      packages: write        # nested jobs request packages: read
      id-token: write        # required throughout
      security-events: write # SARIF uploads from security scanning
      pull-requests: write   # npm-audit-autofix
    with:
      # The build is a plain stdlib Python script, so no toolchain input is
      # needed: `uv` would expect a pyproject.toml this repo does not have, and
      # `enable_lua` is for repos whose *scripts* run Lua - the addon's own Lua
      # is only ever executed by the game client.
      #
      # This does mean Python is whatever the runner ships rather than a pinned
      # version; build.sh checks for the 3.9 minimum the script's annotations
      # need and fails with a clear message rather than a SyntaxError.
      tool: bash

      # Only main packages and releases; pull requests build nothing. Releases
      # are additionally gated on the event being a push inside the reusable
      # workflow, so a PR cannot publish even if it built.
      build_main: "./build.sh"
      artifact_path: "Release"
      publish_github_release: true
